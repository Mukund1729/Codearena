[server]
http_port = 3000

[security]
admin_user = admin
admin_password = admin

[users]
default_theme = dark

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/home.json

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info
