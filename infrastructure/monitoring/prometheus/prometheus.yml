global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'codearena'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway
  - job_name: 'api-gateway'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - codearena
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_name]
        action: keep
        regex: 'api-gateway-.*'
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: '$1:3000'
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance

  # Problem Service
  - job_name: 'problem-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - codearena
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_name]
        action: keep
        regex: 'problem-service-.*'
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: '$1:3001'
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
    metrics_path: '/actuator/prometheus'

  # Submission Service
  - job_name: 'submission-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - codearena
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_name]
        action: keep
        regex: 'submission-service-.*'
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: '$1:3002'
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance

  # Execution Service
  - job_name: 'execution-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - codearena
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_name]
        action: keep
        regex: 'execution-service-.*'
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: '$1:3003'
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
    metrics_path: '/actuator/prometheus'

  # WebSocket Service
  - job_name: 'websocket-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - codearena
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_name]
        action: keep
        regex: 'websocket-service-.*'
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: '$1:3004'
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance

  # Contest Service
  - job_name: 'contest-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - codearena
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_name]
        action: keep
        regex: 'contest-service-.*'
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: '$1:3005'
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
    metrics_path: '/actuator/prometheus'

  # AI Review Service
  - job_name: 'ai-review-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - codearena
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_name]
        action: keep
        regex: 'ai-review-service-.*'
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: '$1:3006'
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance

  # Kubernetes Nodes
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):10250'
        replacement: '${1}:9100'
        target_label: __address__

  # Kubernetes Pods
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
