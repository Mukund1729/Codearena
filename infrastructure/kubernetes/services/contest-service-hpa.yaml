apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contest-service-hpa
  namespace: codearena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contest-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
