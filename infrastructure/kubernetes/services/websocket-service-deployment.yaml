apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-service
  namespace: codearena
  labels:
    app: websocket-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: websocket-service
  template:
    metadata:
      labels:
        app: websocket-service
        version: v1
    spec:
      containers:
      - name: websocket-service
        image: codearena/websocket-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3004
        env:
        - name: NODE_ENV
          value: "production"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: codearena-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: codearena-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codearena-secrets
              key: REDIS_PASSWORD
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq-service:5672"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: codearena-secrets
              key: JWT_SECRET
        - name: FRONTEND_URL
          value: "http://localhost"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-service
  namespace: codearena
  labels:
    app: websocket-service
spec:
  type: ClusterIP
  ports:
  - port: 3004
    targetPort: 3004
    protocol: TCP
  selector:
    app: websocket-service
