apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: codearena
  labels:
    app: api-gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: api-gateway
        image: codearena/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: codearena-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: codearena-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codearena-secrets
              key: REDIS_PASSWORD
        - name: PROBLEM_SERVICE_URL
          value: "http://problem-service:3001"
        - name: SUBMISSION_SERVICE_URL
          value: "http://submission-service:3002"
        - name: EXECUTION_SERVICE_URL
          value: "http://execution-service:3003"
        - name: CONTEST_SERVICE_URL
          value: "http://contest-service:3005"
        - name: AI_REVIEW_SERVICE_URL
          value: "http://ai-review-service:3006"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: codearena-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: codearena
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: api-gateway
