server:
  port: 3003
  servlet:
    context-path: /

spring:
  application:
    name: execution-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}?sslmode=disable&connectTimeout=30&socketTimeout=30
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  rabbitmq:
    # Support both RABBITMQ_URL (cloud) and separate vars (local)
    addresses: ${RABBITMQ_URL:amqp://${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # SSL support for CloudAMQP (requires amqps:// URL)
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

rabbitmq:
  queue:
    submission: codearena.submissions
  exchange:
    result: codearena.results

docker:
  host: ${DOCKER_HOST:unix:///var/run/docker.sock}
  enabled: true

# Execution mode: docker (sandboxed) or process (degraded, no isolation)
execution:
  mode: ${EXECUTION_MODE:docker}

logging:
  level:
    com.codearena: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
