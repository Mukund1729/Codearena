    runtime: node
    buildCommand: cd services/api-gateway && npm install
    startCommand: cd services/api-gateway && npm start
    envVars:
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        value: https://dmttmadjkjydpjhgvnei.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_PzuOo_2Xdwpe_oFv_6LMlQ_UpvQmb2m
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        value: redis://default:gQAAAAAAAu6WAAIgcDJmMzdkNTI5MDljOWY0YmI1OGJhYTllYzgwNDNjZjVhNg@helped-bee-192150.upstash.io:6379
