      - key: SERVER_PORT
        value: 3001
      - key: POSTGRES_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        value: postgres
      - key: POSTGRES_USER
        value: postgres.dmttmadjkjydpjhgvnei
      - key: POSTGRES_PASSWORD
        value: Mukund12n@

  # Submission Service
  - type: web
    name: codearena-submission-service
